name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen de la API
        run: docker build -t taskflow-api:ci ./api

      - name: Construir imagen del worker
        run: docker build -t taskflow-worker:ci ./worker

      - name: Escanear API con Trivy
        uses: uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-api:ci
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Escanear worker con Trivy
        uses: uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-worker:ci
          severity: CRITICAL,HIGH
          exit-code: '0'